name: Rule request
description: Suggest a new open-source readiness check
title: "[Rule] "
labels:
  - rule-request
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What launch readiness issue should this catch?
    validations:
      required: true
  - type: textarea
    id: signal
    attributes:
      label: Local signal
      description: What local file, metadata, or pattern can detect it deterministically?
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
      description: What should maintainers do when the rule fails?
    validations:
      required: true
