[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oss-launch-check"
version = "0.1.0"
description = "Audit whether a repository is ready to launch as an open-source project."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Ukyo" }
]
keywords = ["open-source", "developer-tools", "cli", "repository", "audit", "github", "oss"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities"
]
dependencies = []

[project.scripts]
oss-launch-check = "oss_launch_check.cli:main"

[project.urls]
Homepage = "https://github.com/Uky0Yang/oss-launch-check"
Issues = "https://github.com/Uky0Yang/oss-launch-check/issues"
